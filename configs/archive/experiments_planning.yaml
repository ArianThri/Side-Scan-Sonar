project:
  seed: 42
  label_levels_percent: [10, 25, 50, 100]
  note: label levels are an explicit implementation assumption pending supervisor confirmation

data:
  raw: data/raw/SCTD
  fixed_split: data/splits/group_aware_v1
  limited_subsets: data/splits/limited_labels_group_aware_v1
  yolo: data/processed/yolo_sctd_group_aware_v1
  real_validation_and_test_only: true

conditions:
  - real_only
  - traditional
  - gan
  - standard_diffusion
  - grounded_diffusion

controls:
  same_real_subset_per_label_level: true
  equal_synthetic_budget: true
  synthetic_ratio_to_real: 1.0
  same_detector_initial_weights: true
  same_detector_hyperparameters: true

diffusion:
  image_guided: true
  classifier_free_guidance: true
  validation_selects_guidance_scale: true
  accelerated_sampling: true
  grounded_components:
    geometry: target_shadow_attention
    range: image_recoverable_range_profile
    speckle: log_domain_signal_dependent

ablation:
  - full_grounded
  - no_acoustic
  - no_geometric
  - neither_standard_diffusion

evaluation:
  synthetic: [FID, MMD, LPIPS, SSIM, PSNR]
  detection: [precision, recall, mAP50, mAP50_95]
  per_class: [aircraft, human, ship]
