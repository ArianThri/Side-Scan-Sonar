schema_version: 1
seed: 42

shared:
  input_manifest: data/processed/generative_256_v1/manifest.csv
  image_size: 256
  channels: 3
  classes: [aircraft, human, ship]
  tensor_range: [-1.0, 1.0]
  mixed_precision: fp16
  gradient_checkpointing: true
  max_vram_gib: 8
  output_root: models

gan:
  name: resnet18_conditional_unet_patchgan
  transfer_source: torchvision_resnet18_imagenet1k_v1
  generator:
    encoder: resnet18
    pretrained_encoder: true
    decoder_channels: [256, 128, 64, 32]
    class_embedding_dim: 64
    output_activation: tanh
  discriminator:
    architecture: conditional_patchgan
    base_channels: 64
    spectral_normalisation: true
  losses:
    adversarial: hinge
    reconstruction_l1_weight: 10.0
    feature_matching_weight: 1.0
  optimiser:
    name: AdamW
    learning_rate_generator: 0.0001
    learning_rate_discriminator: 0.0001
    betas: [0.0, 0.99]
    weight_decay: 0.0001
  full:
    epochs: 200
    batch_size: 4
    gradient_accumulation_steps: 2
    early_stopping_patience: 25
  pilot:
    max_train_samples: 12
    max_validation_samples: 6
    epochs: 1
    batch_size: 2
    gradient_accumulation_steps: 1

diffusion:
  name: class_conditional_image_guided_ddpm
  pretrained_model: google/ddpm-celebahq-256
  pretrained_domain: optical_face_images
  transfer_policy: load_compatible_unet_weights_and_train_new_class_embedding
  scheduler:
    training: DDPMScheduler
    prediction_type: epsilon
    beta_schedule: linear
    num_train_timesteps: 1000
    inference: DDIMScheduler
    inference_steps: 50
  conditioning:
    type: classifier_free_guidance
    null_class_index: 3
    condition_dropout_probability: 0.10
    guidance_scale_candidates: [1.0, 2.0, 3.0, 5.0]
    guidance_scale_selection: fixed_real_validation_set
  image_guidance:
    method: source_noising_then_ddim_denoising
    strength_candidates: [0.30, 0.45, 0.60]
  optimiser:
    name: AdamW
    learning_rate: 0.00001
    betas: [0.9, 0.999]
    weight_decay: 0.01
  full:
    max_train_steps: 20000
    batch_size: 1
    gradient_accumulation_steps: 8
    checkpoint_every_steps: 1000
    validation_every_steps: 500
  pilot:
    max_train_samples: 8
    max_validation_samples: 4
    max_train_steps: 2
    batch_size: 1
    gradient_accumulation_steps: 1
    inference_steps: 4
    precision: float32
    note: direct fp16 pilot produced a non-finite loss; full AMP requires GradScaler and finite-loss gating

grounding:
  backbone_and_sampling_identical_to_standard_diffusion: true
  geometric:
    component: target_shadow_consistency
    input: transformed_bounding_boxes_and_source_image
    implementation: differentiable_target_to_adjacent_dark_region_feature_consistency
    loss_weight: 0.10
  acoustic:
    range:
      component: recoverable_cross_track_intensity_profile
      unavailable_navigation_parameters_are_not_inferred: true
      loss_weight: 0.05
    speckle:
      component: log_domain_signal_dependent_residual
      epsilon: 0.00392156862745098
      loss_weight: 0.05
  ablations:
    full: {geometric: true, range: true, speckle: true}
    no_acoustic: {geometric: true, range: false, speckle: false}
    no_geometric: {geometric: false, range: true, speckle: true}
    neither: {geometric: false, range: false, speckle: false}

synthetic_generation:
  budget_ratio_to_real: 1.0
  allocation: one_generated_candidate_per_real_source_image
  source_identifier_required: true
  annotation_policy: retain_only_after_localisation_validation
  ambiguous_or_missing_target_policy: reject

detector:
  model: yolo11n.pt
  image_size: 640
  optimiser: AdamW
  initial_learning_rate: 0.001
  batch_size: 8
  epochs: 100
  patience: 20
  workers: 4
  amp: true
  seed: 42
  deterministic: true
  pretrained_weights_identical_across_conditions: true
  detector_side_augmentation_identical_across_conditions: true
  validation_and_test_real_only: true
